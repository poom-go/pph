<script>
function getTimeGroup(value) {
  const time = extractTime(value);

  if (!time) return "그 외";

  const totalMinutes = time.hour * 60 + time.minute + time.second / 60;

  if (totalMinutes >= 9 * 60 && totalMinutes < 10 * 60) {
    return "9:00~10:00";
  }

  if (totalMinutes >= 10 * 60 && totalMinutes < 11 * 60) {
    return "10:00~11:00";
  }

  if (totalMinutes >= 11 * 60 && totalMinutes < 12 * 60 + 30) {
    return "11:00~12:30";
  }

  if (totalMinutes >= 13 * 60 + 30 && totalMinutes < 14 * 60 + 45) {
    return "13:30~14:45";
  }

  if (totalMinutes >= 15 * 60 && totalMinutes < 16 * 60) {
    return "15:00~16:00";
  }

  if (totalMinutes >= 16 * 60 && totalMinutes < 16 * 60 + 45) {
    return "16:00~16:45";
  }

  if (totalMinutes >= 17 * 60 && totalMinutes < 18 * 60) {
    return "17:00~18:00";
  }

  return "그 외";
}
</script>
